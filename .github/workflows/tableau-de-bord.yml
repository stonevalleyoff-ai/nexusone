name: Build APK Tableau de bord

# Le projet vit dans le sous-dossier TableauDeBord/ de ce dépôt.
# (Son propre .github/workflows/build.yml servira tel quel s'il passe dans un dépôt à lui.)
on:
  push:
    paths:
      - 'TableauDeBord/**'
      - '.github/workflows/tableau-de-bord.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TableauDeBord
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Récupérer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tdb.jks"
            echo "TDB_KEYSTORE_FILE=$RUNNER_TEMP/tdb.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de secret KEYSTORE_BASE64 : APK signé avec une clé de debug temporaire, la connexion Google ne marchera pas."
          fi

      - name: Compiler
        env:
          TDB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TDB_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'tdb' }}
          TDB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$TDB_KEYSTORE_FILE" ]; then
            manque=""
            [ -z "$TDB_KEYSTORE_PASSWORD" ] && manque="$manque KEYSTORE_PASSWORD"
            [ -z "$TDB_KEY_PASSWORD" ] && manque="$manque KEY_PASSWORD"
            if [ -n "$manque" ]; then
              echo "::error::Secret(s) GitHub manquant(s) ou vide(s) :$manque"
              exit 1
            fi
          fi
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Empreinte SHA-1 de l'APK (à déclarer dans l'ID client OAuth Android)
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | tee certs.txt
          echo "### Signature de l'APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "DN|SHA-1" certs.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: TableauDeBord-${{ github.run_number }}
          path: TableauDeBord/app/build/outputs/apk/release/*.apk
          retention-days: 30
