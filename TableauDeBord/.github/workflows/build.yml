name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Récupérer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tdb.jks"
            echo "TDB_KEYSTORE_FILE=$RUNNER_TEMP/tdb.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de secret KEYSTORE_BASE64 : APK signé avec une clé de debug temporaire, la connexion Google ne marchera pas."
          fi

      - name: Compiler
        env:
          TDB_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TDB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TDB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: TableauDeBord-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
