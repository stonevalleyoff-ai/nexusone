[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
coreKtx = "1.15.0"
activityCompose = "1.9.3"
fragment = "1.8.5"
appcompat = "1.7.0"
lifecycle = "2.8.7"
navigation = "2.8.5"
composeBom = "2024.12.01"
room = "2.6.1"
sqlcipher = "4.6.1"
sqlite = "2.4.0"
biometric = "1.1.0"
glance = "1.1.1"
playServicesAuth = "21.3.0"
